name: Admin web CI

on:
  pull_request:
    paths:
      - src/admin/**
      - .github/workflows/admin-ci.yml
  push:
    branches: [main]
    paths:
      - src/admin/**
      - .github/workflows/admin-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

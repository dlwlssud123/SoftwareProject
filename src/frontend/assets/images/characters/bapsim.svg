<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- 전통 유기(황금 놋그릇) 그라데이션 - 고급스럽고 온화한 한국 전통 식기 -->
    <linearGradient id="brassBowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="30%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>

    <!-- 놋그릇 입술 전 테두리 (빛 반사) -->
    <linearGradient id="brassRimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="50%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- 윤기 자르르 흐르는 뽀얀 고봉밥 그라데이션 -->
    <radialGradient id="pureRiceGrad" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FFFDF7"/>
      <stop offset="90%" stop-color="#F6EEDB"/>
      <stop offset="100%" stop-color="#E7DBC4"/>
    </radialGradient>

    <!-- 구수한 김 모락모락 그라데이션 -->
    <linearGradient id="warmSteamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </linearGradient>

    <!-- 황금 숟가락 그라데이션 -->
    <linearGradient id="goldSpoonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>

    <filter id="softGlow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 가마솥에서 갓 지어 모락모락 피어나는 구수한 김 (하트 & 온기 곡선) -->
  <path d="M 88,26 C 82,14 94,8 90,2" fill="none" stroke="url(#warmSteamGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 112,28 C 118,16 108,10 114,3" fill="none" stroke="url(#warmSteamGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- 사랑 가득 하트 김 -->
  <path d="M 100,15 C 97,10 90,11 91,16 C 92,20 100,24 100,24 C 100,24 108,20 109,16 C 110,11 103,10 100,15 Z" fill="#F59E0B" opacity="0.6"/>

  <!-- 뒤쪽 들고 있는 복 숟가락 (황금빛 유기 숟가락) -->
  <g transform="rotate(24 162 92)" filter="url(#softGlow)">
    <rect x="157" y="52" width="7" height="60" rx="3.5" fill="url(#goldSpoonGrad)"/>
    <ellipse cx="160.5" cy="45" rx="13" ry="17" fill="url(#goldSpoonGrad)"/>
    <ellipse cx="160.5" cy="45" rx="8" ry="12" fill="#FEF08A" opacity="0.4"/>
    <!-- 숟가락 안 '壽'(목숨 수) 각인 - 어르신 무병장수 기원 -->
    <text x="160.5" y="49" font-family="'Noto Sans KR', sans-serif" font-size="9" font-weight="900" fill="#854D0E" text-anchor="middle" opacity="0.8">壽</text>
  </g>

  <!-- 복스럽고 몽글몽글한 고봉밥 쌀밥 머리 -->
  <g filter="url(#softGlow)">
    <circle cx="66" cy="85" r="33" fill="url(#pureRiceGrad)"/>
    <circle cx="134" cy="85" r="33" fill="url(#pureRiceGrad)"/>
    <circle cx="100" cy="62" r="38" fill="url(#pureRiceGrad)"/>
    <circle cx="76" cy="56" r="28" fill="url(#pureRiceGrad)"/>
    <circle cx="124" cy="56" r="28" fill="url(#pureRiceGrad)"/>
    <circle cx="100" cy="82" r="44" fill="url(#pureRiceGrad)"/>
  </g>

  <!-- 머리 위 건강의 상징: 싱그러운 완두콩 새싹 -->
  <g filter="url(#softGlow)">
    <!-- 콩알 -->
    <circle cx="94" cy="36" r="5" fill="#65A30D"/>
    <!-- 연둣빛 새싹 잎사귀 2장 -->
    <path d="M 94,33 C 90,24 99,20 102,26 C 99,28 96,30 94,33 Z" fill="#84CC16"/>
    <path d="M 96,33 C 104,27 109,33 103,37 C 100,36 98,34 96,33 Z" fill="#4D7C0F"/>
  </g>

  <!-- 복스러운 전통 놋그릇 (유기 밥그릇 몸체) -->
  <g filter="url(#softGlow)">
    <!-- 밥그릇 굽받침 -->
    <path d="M 76,168 L 124,168 L 120,179 L 80,179 Z" fill="#713F12"/>
    <ellipse cx="100" cy="179" rx="20" ry="2.5" fill="#58310E"/>

    <!-- 놋그릇 둥근 몸체 -->
    <path d="M 36,98 C 36,150 68,170 100,170 C 132,170 164,150 164,98 Z" fill="url(#brassBowlGrad)"/>

    <!-- 놋그릇 전 테두리 림 (Rim) -->
    <ellipse cx="100" cy="98" rx="64" ry="9" fill="url(#brassRimGrad)"/>

    <!-- 놋그릇 전통 구름·당초 문양 띠 -->
    <path d="M 48,122 Q 100,144 152,122" fill="none" stroke="#FEF08A" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8"/>

    <!-- 밥그릇 중앙 '식(食)이 보약' 복 마크 -->
    <circle cx="100" cy="134" r="11" fill="#713F12" opacity="0.25"/>
    <text x="100" y="138" font-family="'Noto Sans KR', sans-serif" font-size="11" font-weight="900" fill="#FEF08A" text-anchor="middle">食</text>
  </g>

  <!-- 푸근하고 복스러운 하회탈 눈웃음 (어르신들이 가장 좋아하시는 활짝 웃는 인상) -->
  <!-- 눈썹 -->
  <path d="M 70,72 Q 78,66 86,72" fill="none" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 114,72 Q 122,66 130,72" fill="none" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 반달 눈웃음 (사르르 감은 온화한 눈) -->
  <path d="M 68,82 Q 78,71 88,82" fill="none" stroke="#2B1808" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 112,82 Q 122,71 132,82" fill="none" stroke="#2B1808" stroke-width="4.5" stroke-linecap="round"/>

  <!-- 복스러운 통통한 복숭아빛 볼살 터치 -->
  <ellipse cx="64" cy="91" rx="11" ry="8" fill="#F43F5E" opacity="0.45"/>
  <ellipse cx="136" cy="91" rx="11" ry="8" fill="#F43F5E" opacity="0.45"/>

  <!-- 오밀조밀 작은 코 -->
  <ellipse cx="100" cy="85" rx="2.5" ry="1.8" fill="#D97706"/>

  <!-- 활짝 열린 구수하고 시원한 미소 입 -->
  <path d="M 91,90 C 91,102 109,102 109,90 Z" fill="#BE123C"/>
  <path d="M 94,92 Q 100,88 106,92" fill="none" stroke="#FDA4AF" stroke-width="2.5"/>

  <!-- 앙증맞은 양손 -->
  <!-- 왼손: 밥그릇을 살포시 받친 손 -->
  <ellipse cx="48" cy="106" rx="8.5" ry="7.5" fill="#FFFDF7" stroke="#E7DBC4" stroke-width="1.5" filter="url(#softGlow)"/>
  <!-- 오른손: 밥 숟가락 쪽을 향해 앙증맞게 쥔 손 -->
  <ellipse cx="152" cy="106" rx="8.5" ry="7.5" fill="#FFFDF7" stroke="#E7DBC4" stroke-width="1.5" filter="url(#softGlow)"/>

  <!-- 식사 온기와 행복의 반짝이 -->
  <path d="M 42,46 Q 42,54 34,54 Q 42,54 42,62 Q 42,54 50,54 Q 42,54 42,46 Z" fill="#FBBF24" opacity="0.85"/>
  <path d="M 162,36 Q 162,42 156,42 Q 162,42 162,48 Q 162,42 168,42 Q 162,42 162,36 Z" fill="#FBBF24" opacity="0.85"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="pupBody" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFE3A3"/>
      <stop offset="70%" stop-color="#F5C065"/>
      <stop offset="100%" stop-color="#E2A645"/>
    </radialGradient>
    <radialGradient id="earGradL" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E2A645"/>
      <stop offset="100%" stop-color="#C28224"/>
    </radialGradient>
    <radialGradient id="earGradR" cx="70%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E2A645"/>
      <stop offset="100%" stop-color="#C28224"/>
    </radialGradient>
    <linearGradient id="collarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 귀 (양쪽) -->
  <path d="M 45,75 C 20,70 15,115 35,135 C 48,145 58,125 55,100 Z" fill="url(#earGradL)" filter="url(#shadow)"/>
  <path d="M 155,75 C 180,70 185,115 165,135 C 152,145 142,125 145,100 Z" fill="url(#earGradR)" filter="url(#shadow)"/>

  <!-- 얼굴 본체 -->
  <circle cx="100" cy="100" r="62" fill="url(#pupBody)" filter="url(#shadow)"/>

  <!-- 이마 하이라이트/얼굴 털 무늬 -->
  <path d="M 85,42 C 95,38 105,38 115,42 C 108,55 92,55 85,42 Z" fill="#FFF2D6" opacity="0.8"/>

  <!-- 양 볼터치 -->
  <circle cx="58" cy="116" r="14" fill="#FF8A8A" opacity="0.45"/>
  <circle cx="142" cy="116" r="14" fill="#FF8A8A" opacity="0.45"/>

  <!-- 반짝이는 큰 눈 -->
  <!-- 왼눈 -->
  <ellipse cx="74" cy="94" rx="9" ry="11" fill="#2E1C0C"/>
  <circle cx="71" cy="90" r="3.5" fill="#FFFFFF"/>
  <circle cx="77" cy="97" r="1.5" fill="#FFFFFF"/>
  <!-- 오른눈 -->
  <ellipse cx="126" cy="94" rx="9" ry="11" fill="#2E1C0C"/>
  <circle cx="123" cy="90" r="3.5" fill="#FFFFFF"/>
  <circle cx="129" cy="97" r="1.5" fill="#FFFFFF"/>

  <!-- 눈썹 -->
  <path d="M 66,78 Q 75,73 84,77" fill="none" stroke="#9A6517" stroke-width="3" stroke-linecap="round"/>
  <path d="M 134,78 Q 125,73 116,77" fill="none" stroke="#9A6517" stroke-width="3" stroke-linecap="round"/>

  <!-- 주둥이 구역 (흰색 머즐) -->
  <ellipse cx="100" cy="118" rx="26" ry="20" fill="#FFF8EB"/>

  <!-- 까만 코 -->
  <path d="M 93,108 C 93,104 107,104 107,108 C 107,114 102,117 100,117 C 98,117 93,114 93,108 Z" fill="#2E1C0C"/>
  <ellipse cx="98" cy="107" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.6"/>

  <!-- 입 & 빼꼼 나온 귀여운 분홍 혀 -->
  <path d="M 94,118 Q 100,123 100,126 Q 100,123 106,118" fill="none" stroke="#2E1C0C" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 96,124 C 96,134 104,134 104,124 Z" fill="#FF6B8B"/>

  <!-- 파란 리본 목걸이 & 반짝이는 금방울 -->
  <path d="M 68,154 Q 100,166 132,154" fill="none" stroke="url(#collarGrad)" stroke-width="9" stroke-linecap="round" filter="url(#shadow)"/>
  <circle cx="100" cy="164" r="8.5" fill="#FBBF24" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="98" cy="162" r="2.5" fill="#FEF3C7"/>
  <circle cx="100" cy="166" r="1.5" fill="#78350F"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- 포근한 황구 털 그라데이션 (시골 누렁이의 따스하고 복스러운 빛깔) -->
    <radialGradient id="pupBody" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFE7B8"/>
      <stop offset="55%" stop-color="#F7C875"/>
      <stop offset="85%" stop-color="#E5A742"/>
      <stop offset="100%" stop-color="#D08E28"/>
    </radialGradient>

    <!-- 귀 그라데이션 (순박하게 쳐진 귀) -->
    <radialGradient id="earGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E5A742"/>
      <stop offset="70%" stop-color="#C58525"/>
      <stop offset="100%" stop-color="#A26615"/>
    </radialGradient>

    <!-- 복주머니 붉은단청 그라데이션 -->
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>

    <!-- 황금 장식 그라데이션 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- 밀짚모자 그라데이션 -->
    <linearGradient id="strawGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0B678"/>
      <stop offset="50%" stop-color="#F5D49B"/>
      <stop offset="100%" stop-color="#D4A35B"/>
    </linearGradient>

    <filter id="softShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- 순박하게 살포시 내려앉은 큰 귀 (양쪽) -->
  <path d="M 44,70 C 18,65 14,118 36,138 C 50,148 60,126 56,98 Z" fill="url(#earGrad)" filter="url(#softShadow)"/>
  <path d="M 156,70 C 182,65 186,118 164,138 C 150,148 140,126 144,98 Z" fill="url(#earGrad)" filter="url(#softShadow)"/>

  <!-- 복스럽고 둥글둥글한 얼굴 본체 -->
  <circle cx="100" cy="102" r="64" fill="url(#pupBody)" filter="url(#softShadow)"/>

  <!-- 머리 위 정겨운 시골 밀짚모자 (어르신 감성 살짝 비스듬히 얹음) -->
  <g transform="rotate(-7 100 42)" filter="url(#softShadow)">
    <!-- 모자 챙 -->
    <ellipse cx="100" cy="48" rx="42" ry="11" fill="url(#strawGrad)"/>
    <!-- 모자 띠 (고운 청록색 댕기 리본) -->
    <ellipse cx="100" cy="46" rx="26" ry="7" fill="#0D9488"/>
    <!-- 모자 돔 -->
    <path d="M 76,46 C 76,26 124,26 124,46 Z" fill="url(#strawGrad)"/>
    <ellipse cx="100" cy="27" rx="10" ry="3" fill="#D4A35B"/>
  </g>

  <!-- 이마의 밝고 복스러운 털 무늬 -->
  <path d="M 90,52 C 96,48 104,48 110,52 C 105,68 95,68 90,52 Z" fill="#FFF6E5" opacity="0.85"/>

  <!-- 푸근하고 인자한 눈썹 -->
  <path d="M 66,80 Q 77,74 88,80" fill="none" stroke="#8C5311" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 134,80 Q 123,74 112,80" fill="none" stroke="#8C5311" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 착하고 순박한 맑은 눈망울 (어르신을 든든히 바라보는 눈) -->
  <!-- 왼눈 -->
  <ellipse cx="76" cy="95" rx="8.5" ry="10.5" fill="#26170B"/>
  <circle cx="73.5" cy="91.5" r="3.2" fill="#FFFFFF"/>
  <circle cx="79" cy="97" r="1.5" fill="#FFFFFF"/>
  <!-- 오른눈 -->
  <ellipse cx="124" cy="95" rx="8.5" ry="10.5" fill="#26170B"/>
  <circle cx="121.5" cy="91.5" r="3.2" fill="#FFFFFF"/>
  <circle cx="127" cy="97" r="1.5" fill="#FFFFFF"/>

  <!-- 복스러운 통통한 흰색 주둥이 (머즐) -->
  <ellipse cx="100" cy="120" rx="27" ry="21" fill="#FFFDF8" filter="url(#softShadow)"/>

  <!-- 촉촉하고 까만 코 -->
  <path d="M 93,109 C 93,104 107,104 107,109 C 107,115 102,118 100,118 C 98,118 93,115 93,109 Z" fill="#26170B"/>
  <ellipse cx="98" cy="108" rx="2.5" ry="1.2" fill="#FFFFFF" opacity="0.6"/>

  <!-- 온화하게 미소 짓는 입 & 앙증맞은 분홍 혀 -->
  <path d="M 93,120 Q 100,126 100,129 Q 100,126 107,120" fill="none" stroke="#26170B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 96,127 C 96,137 104,137 104,127 Z" fill="#F43F5E"/>

  <!-- 발그레한 복숭아빛 볼터치 -->
  <circle cx="56" cy="116" r="13" fill="#FB7185" opacity="0.4"/>
  <circle cx="144" cy="116" r="13" fill="#FB7185" opacity="0.4"/>

  <!-- 목걸이: 색동 오색 매듭 & 붉은 복(福)주머니 -->
  <!-- 목끈 -->
  <path d="M 68,154 Q 100,168 132,154" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" filter="url(#softShadow)"/>
  <path d="M 68,154 Q 100,168 132,154" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/>

  <!-- 중앙 붉은 복(福)주머니 -->
  <g transform="translate(100, 168)" filter="url(#softShadow)">
    <!-- 주머니 본체 -->
    <path d="M -16, -6 C -16, 12 -8, 18 0, 18 C 8, 18 16, 12 16, -6 C 10, -3 -10, -3 -16, -6 Z" fill="url(#pouchGrad)"/>
    <!-- 주머니 주름 윗단 -->
    <path d="M -13, -6 Q 0, -2 13, -6 L 16, -11 Q 0, -7 -16, -11 Z" fill="#DC2626"/>
    <!-- 금색 묶음 끈 -->
    <ellipse cx="0" cy="-6" rx="9" ry="2.5" fill="url(#goldGrad)"/>
    <!-- 한자 '福' 금박 각인 -->
    <text x="0" y="8" font-family="'Noto Sans KR', sans-serif" font-size="11" font-weight="900" fill="#FEF08A" text-anchor="middle">福</text>
    <!-- 주머니 밑 금태슬 -->
    <path d="M 0, 18 L 0, 26" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="27" r="2" fill="#D97706"/>
  </g>

  <!-- 양쪽 조그만 귀여운 앞발 (두 손을 곱게 모아 인사하는 느낌) -->
  <ellipse cx="64" cy="158" rx="10" ry="8" fill="#FFFDF8" stroke="#E5A742" stroke-width="1.5" filter="url(#softShadow)"/>
  <ellipse cx="136" cy="158" rx="10" ry="8" fill="#FFFDF8" stroke="#E5A742" stroke-width="1.5" filter="url(#softShadow)"/>
</svg>